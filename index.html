<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/webp" href="https://i.postimg.cc/QCHNNk9K/icon.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SimplyPurified | Secure Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .hero-bg { background: linear-gradient(135deg, #0077b6 0%, #00b4d8 100%); border-radius: 0 0 40px 40px; }
        .btn-main { background: #1e293b; color: #ffffff; box-shadow: 0 10px 25px -5px rgba(30, 41, 59, 0.3); transition: all 0.2s; }
        .btn-main:active { transform: scale(0.98); }
        .step-hidden { display: none; }
        input, select, textarea { border: 2px solid #f1f5f9 !important; transition: border-color 0.2s; -webkit-appearance: none; }
    </style>
</head>
<body class="pb-24">

    <header class="hero-bg py-12 text-center text-white shadow-lg mb-8">
        <div class="mb-4 flex justify-center">
            <img src="https://i.postimg.cc/QCHNNk9K/icon.webp" class="w-20 h-20 rounded-full border-4 border-white/20 shadow-2xl" alt="Logo">
        </div>
        <h1 class="text-3xl font-black italic uppercase tracking-tighter text-white">SimplyPurified</h1>
        <p class="text-[10px] font-bold opacity-80 uppercase tracking-widest mt-1 text-white/80">Premium Brackenhurst Water</p>
    </header>

    <main class="max-w-md mx-auto px-6">
        <div id="step1">
            <div class="bg-white rounded-[2.5rem] shadow-xl p-8 border border-slate-100 mb-6">
                <div class="flex justify-between items-center mb-8">
                    <div>
                        <h2 class="text-xl font-black text-slate-800 uppercase italic leading-tight">Case of 24</h2>
                        <p id="waterTotalStep1" class="text-2xl font-black text-blue-600 mt-1">R105.00</p>
                    </div>
                    <div class="flex items-center gap-4 bg-slate-50 p-2 rounded-2xl">
                        <button onclick="changeQty(-1)" class="w-10 h-10 bg-white rounded-xl shadow-sm font-black text-xl text-blue-600">−</button>
                        <input type="number" id="qtyInput" value="1" readonly class="w-8 text-center font-black text-xl bg-transparent border-none">
                        <button onclick="changeQty(1)" class="w-10 h-10 bg-white rounded-xl shadow-sm font-black text-xl text-blue-600">+</button>
                    </div>
                </div>
                <input type="text" id="userName" placeholder="Full Name" class="w-full p-4 rounded-2xl bg-slate-50 font-bold mb-4">
                <input type="tel" id="userPhone" placeholder="Phone Number" class="w-full p-4 rounded-2xl bg-slate-50 font-bold">
            </div>
            <button onclick="toggleSteps(2)" class="w-full btn-main py-6 rounded-[2rem] font-black uppercase text-lg italic shadow-lg">DELIVERY DETAILS <i class="fas fa-truck ml-2"></i></button>
        </div>

        <div id="step2" class="step-hidden">
            <div class="bg-white rounded-[2.5rem] shadow-xl p-8 border border-slate-100 mb-6">
                <button onclick="toggleSteps(1)" class="text-blue-500 text-[11px] font-black uppercase mb-6"><i class="fas fa-chevron-left mr-1"></i> Edit Order</button>
                
                <div class="space-y-5">
                    <label class="block text-[10px] font-black uppercase text-slate-400 ml-2">Local Delivery Zone</label>
                    <select id="deliveryArea" onchange="calculateTotal()" class="w-full p-4 rounded-2xl bg-slate-50 font-bold text-slate-700 border-none outline-none">
                        <option value="0">Select Destination...</option>
                        <option value="35">Brackenhurst / Brackendowns (R35)</option>
                        <option value="55">Alberton North / Meyersdal (R55)</option>
                        <option value="75">JHB South / Mondeor (R75)</option>
                        <option value="95">Germiston / Bedfordview (R95)</option>
                        <option value="0">Self-Collection (Free)</option>
                    </select>

                    <input type="text" id="address" placeholder="Street Address" class="w-full p-4 rounded-2xl bg-slate-50 font-bold">
                    <textarea id="notes" placeholder="Notes (Gate code, etc.)" class="w-full p-4 rounded-2xl bg-slate-50 font-bold h-20 resize-none"></textarea>
                </div>

                <div class="mt-8 pt-6 border-t border-dashed border-slate-200">
                    <div class="flex justify-between text-sm font-bold text-slate-400 uppercase">
                        <span>Water Total</span>
                        <span id="waterDisplay">R105.00</span>
                    </div>
                    <div class="flex justify-between text-sm font-bold text-slate-400 uppercase mt-2">
                        <span>Uber Est. Shipping</span>
                        <span id="feeDisplay">R0.00</span>
                    </div>
                    <div class="flex justify-between items-center mt-4">
                        <span class="text-lg font-black uppercase italic text-slate-800">Total Due</span>
                        <span id="grandTotalDisplay" class="text-2xl font-black text-blue-600">R105.00</span>
                    </div>
                </div>
            </div>
            
            <button onclick="redirectToYoco()" class="w-full bg-blue-600 text-white py-6 rounded-[2rem] font-black uppercase text-lg flex flex-col items-center shadow-lg active:scale-95 transition-transform">
                <span>PAY SECURELY <i class="fas fa-shield-halved ml-1"></i></span>
                <span class="text-[10px] opacity-70 tracking-widest mt-1 uppercase italic">Card • Apple Pay • Google Pay</span>
            </button>
        </div>
    </main>

    <script>
        const PRICE_PER_CASE = 105;
        const YOCO_BASE_URL = "https://pay.yoco.com/simply-purified"; 

        function changeQty(amt) {
            const input = document.getElementById('qtyInput');
            let val = parseInt(input.value) + amt;
            if (val < 1) val = 1;
            input.value = val;
            
            const waterTotal = val * PRICE_PER_CASE;
            document.getElementById('waterTotalStep1').innerText = "R" + waterTotal.toFixed(2);
            calculateTotal();
        }

        function toggleSteps(step) {
            document.getElementById('step1').classList.toggle('step-hidden', step === 2);
            document.getElementById('step2').classList.toggle('step-hidden', step === 1);
            calculateTotal();
            window.scrollTo(0,0);
        }

        function calculateTotal() {
            const qty = parseInt(document.getElementById('qtyInput').value) || 1;
            const deliveryFee = parseFloat(document.getElementById('deliveryArea').value) || 0;
            const waterTotal = qty * PRICE_PER_CASE;
            const grandTotal = waterTotal + deliveryFee;

            if(document.getElementById('waterDisplay')) {
                document.getElementById('waterDisplay').innerText = "R" + waterTotal.toFixed(2);
                document.getElementById('feeDisplay').innerText = "R" + deliveryFee.toFixed(2);
                document.getElementById('grandTotalDisplay').innerText = "R" + grandTotal.toFixed(2);
            }
            return grandTotal;
        }

        function redirectToYoco() {
            const finalAmount = calculateTotal();
            const name = encodeURIComponent(document.getElementById('userName').value);
            const qty = document.getElementById('qtyInput').value;
            const areaDropdown = document.getElementById('deliveryArea');

            if (name === "" || areaDropdown.selectedIndex === 0) {
                alert("Please enter your name and select a delivery destination.");
                return;
            }
            
            const finalUrl = `${YOCO_BASE_URL}?amount=${finalAmount}&firstName=${name}&reference=SP-Order-${qty}`;
            window.location.href = finalUrl;
        }

        window.onload = calculateTotal;
    </script>
</body>
</html>
